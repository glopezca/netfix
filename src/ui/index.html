<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Canonicaliza la antigua URL de GitHub Pages hacia la publicación oficial.
    (() => {
      const url = new URL(window.location.href);
      if (url.hostname.toLowerCase() !== "glopezca.github.io" || !/^\/netfix(?:\/|$)/i.test(url.pathname)) return;
      url.hostname = "infogerman.github.io";
      url.pathname = url.pathname.replace(/^\/netfix(?=\/|$)/i, "/netfix");
      if (url.pathname === "/netfix") url.pathname = "/netfix/";
      window.location.replace(url.href);
    })();
  </script>
  <title>Netfix — laboratorio de redes</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="description" content="Simulador de redes estilo Packet Tracer con CLI de Cisco IOS y servidor DHCP completo.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="web-admin.css">
  <link rel="stylesheet" href="docs.css">
</head>
<body data-mode="realtime">
  <div id="app"></div>
  <noscript lang="es">Netfix necesita JavaScript para simular la red.</noscript><noscript lang="en-GB">Netfix needs JavaScript to simulate the network.</noscript>
  <script type="module" src="js/ui/main.js"></script>
</body>
</html>
