name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc -p tsconfig.json
      - run: npm run test:coverage
      - run: npx tsc -p tsconfig.build.json && node scripts/build.mjs --skip-tsc
      - name: Comprobar que netsim.html precompilado está al día
        run: git diff --quiet -- netsim.html || echo "::warning file=netsim.html::netsim.html no coincide con el build actual; ejecuta npm run build y haz commit."
      - uses: actions/upload-artifact@v4
        with:
          name: netsim-dist
          path: dist/

  pages:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: netsim-dist
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
