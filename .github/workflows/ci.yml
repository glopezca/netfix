name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -p tsconfig.json
      - run: npm run test:coverage
      # Package as a consumer sees it (PR 3.3): tarball contents, imports, closed internal paths, .d.ts without DOM.
      - run: npm run test:pack
      # workerd smoke test (PR 3.4, R11/R12). workerd stays out of the repo (P4), pinned to FixITClassroom's version.
      - run: npm install --prefix "$RUNNER_TEMP/wd" --no-audit --no-fund workerd@1.20261023.1
      - run: npm run test:workerd
        env:
          WORKERD_BIN: ${{ runner.temp }}/wd/node_modules/@cloudflare/workerd-linux-64/bin/workerd
      - run: npx tsc -p tsconfig.build.json && node scripts/build.mjs --skip-tsc
      # e2e subset (R27): Playwright is installed outside the repo (not a dependency); the scripts find it via PLAYWRIGHT_PATH.
      - run: npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.64.1 && node "$RUNNER_TEMP/pw/node_modules/playwright/cli.js" install --with-deps chromium
      - run: for s in e2e-embed e2e-missions e2e-devices; do node scripts/$s.mjs || exit 1; done
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/pw/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: netfix-dist
          path: dist/

  pages:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deployment at a time; a newer push waits instead of cancelling one in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: netfix-dist
          path: dist
      # Landing page (en-GB at the root, es-ES in es/) with the app in app/.
      - run: node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
